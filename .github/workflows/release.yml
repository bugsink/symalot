name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or commit to build; publishing requires a vVERSION tag
        required: true
        type: string
        default: main
      publish:
        description: Publish the tested artifacts to PyPI
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      publish-to-pypi: ${{ steps.version.outputs.publish-to-pypi }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Resolve commit and check release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          with open("Cargo.toml", "rb") as file:
              cargo_version = tomllib.load(file)["package"]["version"]
          if version != cargo_version:
              raise SystemExit("Cargo and Python package versions must match")
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          publish = os.environ["PUBLISH"] == "true"
          if publish and actual != expected:
              raise SystemExit(f"release tag {actual!r} must be {expected!r}")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if publish:
              tag_commit = subprocess.check_output(
                  ["git", "rev-parse", "--verify", f"refs/tags/{actual}^{{commit}}"], text=True
              ).strip()
              if tag_commit != commit:
                  raise SystemExit("Release tag must point at the checked out commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"publish-to-pypi={str(publish).lower()}", file=output)
              print(f"commit={commit}", file=output)
          PY

  linux:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: 1.99.1
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: "2_28"
      - run: python -m pip install pytest
      - run: python -m pip install --no-index --find-links=dist symalot
      - run: python -m pytest
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: 1.99.1
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - run: python -m pip install pytest
      - run: python -m pip install --no-index --find-links=dist symalot
      - run: python -m pytest
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          rust-toolchain: 1.99.1
          args: --out dist
      - run: python -m pip install pytest
      - run: python -m pip wheel --no-deps --wheel-dir wheels dist/*.tar.gz
      - run: python -m pip install --no-index --find-links=wheels symalot
      - run: python -m pytest
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    if: needs.version.outputs.publish-to-pypi == 'true'
    runs-on: ubuntu-latest
    needs: [version, linux, macos, sdist]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
